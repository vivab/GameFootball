<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#091825">
<title>GameFootball — 2D футбол</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4fff9;background:#081621}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;overflow:hidden;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:7px;background:radial-gradient(circle at 50% 10%,#183748 0%,#081621 78%)}
header{height:45px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.4px}small{display:block;color:#9cb7bf;font-size:11px;font-weight:500}
#score{font-weight:900;font-size:23px;white-space:nowrap;font-variant-numeric:tabular-nums}
#clock{font-size:14px;color:#d1e4e3;font-weight:700}
#fieldWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:fill;border-radius:10px}
#banner{position:absolute;left:50%;top:13%;transform:translateX(-50%);background:#081621dc;border:1px solid #ffffff30;border-radius:12px;padding:9px 16px;white-space:nowrap;text-align:center;font-weight:750;font-size:13px;pointer-events:none}
#controls{height:132px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
#pad{position:relative;width:115px;height:115px;border-radius:50%;background:#b4d6df19;border:2px solid #c2e4eb47;touch-action:none}
#pad:after{content:"";position:absolute;inset:33px;border-radius:50%;border:1px dashed #ffffff42}
#stick{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid #d2f2f3;background:#b9e5e55e;border-radius:50%;box-shadow:0 2px 12px #0005;pointer-events:none}
#actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.action{border:2px solid #fff9;color:#fff;font-weight:900;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;user-select:none;-webkit-user-select:none}
#hold{height:73px;width:74px;border-radius:18px;background:#397dba;font-size:11px;box-shadow:0 4px 0 #16436e}
#hold.active{background:#20c994;border-color:#c4ffe8;box-shadow:0 2px 0 #07774f;transform:translateY(2px)}
#kickStack{display:flex;flex-direction:column;align-items:center;gap:8px}
#kick{height:75px;width:75px;border-radius:50%;background:#e88740;font-size:15px;position:relative;box-shadow:0 4px 0 #96431b;overflow:hidden}
#kick:before{content:"";position:absolute;inset:0;background:conic-gradient(#fff398 calc(var(--charge,0)*1%),transparent 0);opacity:.45;pointer-events:none}
#kick span{position:relative;z-index:1;text-shadow:0 1px 2px #663400}
#pass{height:34px;width:83px;border-radius:11px;background:#2eb58d;box-shadow:0 3px 0 #0e614c;font-size:13px}
.action:active{filter:brightness(1.15)}
#menu{position:absolute;inset:0;display:grid;place-items:center;background:#06111bd9;z-index:3;padding:14px}
.panel{width:min(390px,95vw);padding:19px;background:#132c38;border:1px solid #5a889355;border-radius:17px;box-shadow:0 15px 55px #0009;text-align:center}
.panel h2{margin:0 0 5px;font-size:27px}.panel p{font-size:13px;color:#aac4c8;line-height:1.5;margin:8px 0 15px}
.panel button{background:#2de29a;color:#042719;border:0;border-radius:10px;min-height:42px;padding:9px 12px;font-weight:850;cursor:pointer;width:100%;margin:4px 0}
.panel button.secondary{background:#265264;color:#e7faf8}
.panel input{width:100%;min-height:40px;background:#0a1d29;border:1px solid #4b7a85;color:white;border-radius:9px;padding:10px;outline:none}
.panel label{display:block;text-align:left;margin:12px 0 5px;font-size:12px;color:#c6dce0}
#toast{min-height:16px;color:#ffcf95;font-size:12px;padding-top:6px}
#exit{border:1px solid #ffffff3e;background:#113442;color:white;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800}
#roomBadge{background:#183f4b;padding:5px 9px;border-radius:7px;color:#d1f6df;font-size:12px;display:none}
@media(max-height:540px){header{height:28px}h1{font-size:13px}small{display:none}#controls{height:91px}#pad{width:78px;height:78px}#pad:after{inset:22px}#stick{width:32px;height:32px;margin:-16px 0 0 -16px}#actions{gap:6px}#hold{height:58px;width:60px;font-size:10px}#kick{width:58px;height:58px;font-size:12px}#pass{width:66px;height:28px;font-size:11px}#kickStack{gap:4px}}
@media(max-width:355px){#controls{padding:0}#pad{width:96px;height:96px}#actions{gap:5px}#hold{width:58px;height:61px;font-size:10px}#kick{width:65px;height:65px;font-size:12px}#pass{width:70px}}
@media(min-width:850px){#controls{max-width:800px;width:100%;margin:auto}}
</style>
</head>
<body>
<div id="app">
<header><div><h1>⚽ GameFootball</h1><small>Футбол сверху • быстрые матчи</small></div><div id="roomBadge"></div><div><span id="score">0 : 0</span> <span id="clock">03:00</span></div><button id="exit" hidden>МЕНЮ</button></header>
<div id="fieldWrap"><canvas id="field" width="1600" height="900" aria-label="Футбольное поле"></canvas><div id="banner">Выбери режим</div></div>
<div id="controls"><div id="pad"><div id="stick"></div></div><div id="actions"><button id="hold" class="action" aria-label="Удержание мяча">ДЕРЖАТЬ МЯЧ</button><div id="kickStack"><button id="kick" class="action" aria-label="Удар, удерживай для усиления"><span>УДАР</span></button><button id="pass" class="action" aria-label="Точный пас">ПАС</button></div></div></div>
<div id="menu"><section class="panel"><h2>GAMEFOOTBALL</h2><p>Аркадный футбол в духе быстрых онлайн-матчей. Играй с другом или потренируйся против бота.</p><button id="practice">⚽ ТРЕНИРОВКА С БОТОМ</button><button id="create">🌐 СОЗДАТЬ ОНЛАЙН-КОМНАТУ</button><label for="code">Код комнаты друга</label><input id="code" maxlength="6" placeholder="Например: 4HK82J" autocapitalize="characters"><button id="join" class="secondary">ПОДКЛЮЧИТЬСЯ ПО КОДУ</button><label for="server">Адрес игрового сервера (нужен для онлайна)</label><input id="server" placeholder="wss://адрес-вашего-сервера" spellcheck="false" autocomplete="off"><div id="toast"></div></section></div>
</div>
<script type="module">
import {stepMatch,resetMatch} from "./shared/football-core.js";
"use strict";
const W=1600,H=900,P=20,B=11,GOAL=142,L=68,R=1532,T=30,BOTTOM=870,DEPTH=52,SPEED=185,CHARGE_MS=1150;
const $=id=>document.getElementById(id);
const canvas=$("field"),ctx=canvas.getContext("2d");
const keys=new Set();let joy={x:0,y:0},controlHeld=false,charging=false,chargeStart=0,shotSeq=0,passSeq=0,shotCharge=0,localShotSeq=0,localPassSeq=0,mode="menu",socket=null,myId=null,lastFrame=performance.now();
let world={players:[],ball:{x:W/2,y:H/2,vx:0,vy:0},score:[0,0],time:180,status:"waiting"};
$("server").value=localStorage.getItem("gf-server")||"";
$("server").addEventListener("change",()=>localStorage.setItem("gf-server",$("server").value.trim()));
function banner(s){$("banner").textContent=s;$("banner").hidden=!s}
function toast(s){$("toast").textContent=s}
function stopActions(){passing=false;charging=false;controlHeld=false;joy={x:0,y:0};$("hold").classList.remove("active")}
function showMenu(){if(socket){socket.close();socket=null}stopActions();mode="menu";$("menu").hidden=false;$("exit").hidden=true;$("roomBadge").style.display="none";banner("Выбери режим")}
$("exit").onclick=showMenu;
function player(id,team,x,y){return{id,team,x,y,vx:0,vy:0,faceX:team===0?1:-1,faceY:0,cd:0,noControl:0}}
function resetWorld(){const players=[];for(let team=0;team<2;team++)for(let slot=0;slot<5;slot++){const p=player(team===0&&slot===2?"me":"bot"+team+"-"+slot,team,team===0?L+110+slot*90:R-110-slot*90,H/2+(slot-2)*125);p.bot=p.id!=="me";p.slot=slot;players.push(p)}world={players,ball:{x:W/2,y:H/2,vx:0,vy:0},score:[0,0],time:180,status:"playing",tactics:0,aiClock:0};resetMatch(world)}
function startPractice(){resetWorld();camera.ready=false;stopActions();localShotSeq=shotSeq;localPassSeq=passSeq;myId="me";mode="practice";$("menu").hidden=true;$("exit").hidden=false;banner("")}
$("practice").onclick=startPractice;
function normalized(x,y){let l=Math.hypot(x,y);return l>1?{x:x/l,y:y/l}:{x,y}}
function input(){let x=joy.x,y=joy.y;if(keys.has("a")||keys.has("arrowleft"))x-=1;if(keys.has("d")||keys.has("arrowright"))x+=1;if(keys.has("w")||keys.has("arrowup"))y-=1;if(keys.has("s")||keys.has("arrowdown"))y+=1;return normalized(x,y)}
function startCharge(){if(mode==="menu"||charging)return;charging=true;chargeStart=performance.now()}
function releaseCharge(){if(!charging)return;charging=false;if(mode==="menu")return;shotCharge=Math.min(1,(performance.now()-chargeStart)/CHARGE_MS);shotSeq++}
let passing=false,passStart=0,passCharge=0;
function startPass(){if(mode==="menu"||passing)return;passing=true;passStart=performance.now()}
function doPass(){if(mode!=="menu"){passCharge=Math.min(1,(performance.now()-passStart)/900);passSeq++}passing=false}
function holding(){return controlHeld||keys.has("shift")}
window.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();if(keys.has(k))return;keys.add(k);if(k===" ")startCharge();if(k==="e")startPass()});
window.addEventListener("keyup",e=>{const k=e.key.toLowerCase();keys.delete(k);if(k===" ")releaseCharge();if(k==="e")doPass()});
window.addEventListener("blur",()=>{keys.clear();stopActions()});
const pad=$("pad"),stick=$("stick");let touchId=null;
function movePad(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width*.35;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy);if(m>rad){dx*=rad/m;dy*=rad/m}joy=normalized(dx/rad,dy/rad);stick.style.transform=`translate(${dx}px,${dy}px)`}
pad.onpointerdown=e=>{e.preventDefault();if(touchId!==null)return;touchId=e.pointerId;pad.setPointerCapture(touchId);movePad(e)};
pad.onpointermove=e=>{if(touchId===e.pointerId)movePad(e)};
function clearPad(e){if(touchId!==e.pointerId)return;touchId=null;joy={x:0,y:0};stick.style.transform=""}
pad.onpointerup=clearPad;pad.onpointercancel=clearPad;
const kickButton=$("kick"),holdButton=$("hold");
kickButton.onpointerdown=e=>{e.preventDefault();kickButton.setPointerCapture(e.pointerId);startCharge()};
kickButton.onpointerup=releaseCharge;kickButton.onpointercancel=releaseCharge;
$("pass").onpointerdown=e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);startPass()};$("pass").onpointerup=doPass;$("pass").onpointercancel=()=>{passing=false};
holdButton.onpointerdown=e=>{e.preventDefault();holdButton.setPointerCapture(e.pointerId);controlHeld=true;holdButton.classList.add("active")};
function releaseHold(){controlHeld=false;holdButton.classList.remove("active")}
holdButton.onpointerup=releaseHold;holdButton.onpointercancel=releaseHold;
// All match movement, bot tactics, possession and ball physics share
// one implementation with the online server (shared/football-core.js).
function simulate(dt){
 if(world.status!=="playing")return;
 const me=world.players.find(p=>p.id==="me");
 if(!me)return;
 const d=input();
 me.input={x:d.x,y:d.y,control:holding()};
 if(shotSeq!==localShotSeq){
  localShotSeq=shotSeq;me.pendingShot={charge:shotCharge,dir:{x:d.x,y:d.y}};
 }
 if(passSeq!==localPassSeq){
  localPassSeq=passSeq;me.pendingPass={charge:passCharge,dir:{x:d.x,y:d.y}};
 }
 const result=stepMatch(world,dt);
 if(result.goal!==null){
  banner("ГОООЛ! "+(result.goal===0?"Синие":"Красные"));
  setTimeout(()=>{if(mode==="practice"&&world.status==="playing")banner("")},1000);
 }
 if(result.finished)banner("Матч окончен • открой меню");
}
function connect(action){
 const entered=$("server").value.trim();let url=entered;
 if(!url&&!location.hostname.endsWith("github.io"))url=(location.protocol==="https:"?"wss://":"ws://")+location.host;
 if(!/^wss?:\/\//i.test(url)){toast("Для онлайна нужен адрес запущенного сервера (wss://...).");return}
 localStorage.setItem("gf-server",entered);
 if(socket)socket.close();
 try{socket=new WebSocket(url)}catch(e){toast("Неверный адрес сервера");return}
 toast("Подключаемся...");
 socket.onopen=()=>socket.send(JSON.stringify(action));
 socket.onmessage=e=>{
  let msg;try{msg=JSON.parse(e.data)}catch{return}
  if(msg.type==="welcome"){mode="online";myId=msg.id;camera.ready=false;stopActions();world={players:[],ball:{x:W/2,y:H/2},score:[0,0],time:180,status:"waiting"};$("menu").hidden=true;$("exit").hidden=false;$("roomBadge").textContent="КОМНАТА "+msg.code;$("roomBadge").style.display="block";banner("Ждём второго игрока • код "+msg.code)}
  if(msg.type==="state"){world=msg;$("roomBadge").textContent="КОМНАТА "+msg.code;banner(msg.status==="waiting"?"Ждём второго игрока • код "+msg.code:msg.status==="finished"?"Матч окончен":"")}
  if(msg.type==="error")toast(msg.message||"Ошибка подключения");
 };
 socket.onerror=()=>toast("Ошибка сети. Проверь сервер и адрес.");
 socket.onclose=()=>{if(mode==="online"){banner("Связь с сервером потеряна");$("roomBadge").textContent="НЕТ СОЕДИНЕНИЯ"}};
}
$("create").onclick=()=>connect({type:"create"});
$("join").onclick=()=>{const code=$("code").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast("Введи код из 6 символов");return}connect({type:"join",code})};
function paintGoal(side){
 const left=side==="left"?L-DEPTH:R,right=side==="left"?L:R+DEPTH,top=H/2-GOAL,bottom=H/2+GOAL;
 ctx.fillStyle="#0a3136";ctx.fillRect(left,top,right-left,bottom-top);
 ctx.save();ctx.beginPath();ctx.rect(left,top,right-left,bottom-top);ctx.clip();
 ctx.strokeStyle="#d7fff58c";ctx.lineWidth=1;
 for(let y=top;y<=bottom;y+=13){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}
 for(let x=left;x<=right;x+=12){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}
 ctx.restore();
 ctx.strokeStyle="#ecffff";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(right,top);ctx.lineTo(right,bottom);ctx.lineTo(left,bottom);ctx.stroke();
 const mouthX=side==="left"?L:R;ctx.fillStyle="#fff";for(const y of [top,bottom]){ctx.beginPath();ctx.arc(mouthX,y,5,0,Math.PI*2);ctx.fill()}
}
function drawField(){
 ctx.fillStyle="#092d31";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#166e4b";ctx.fillRect(L,T,R-L,BOTTOM-T);
 for(let i=0;i<11;i++){ctx.fillStyle=i%2?"#ffffff0b":"#00000008";ctx.fillRect(L+i*(R-L)/11,T,(R-L)/11,BOTTOM-T)}
 paintGoal("left");paintGoal("right");
 ctx.strokeStyle="#ceffe1c4";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(R,T);ctx.lineTo(R,H/2-GOAL);ctx.moveTo(R,H/2+GOAL);ctx.lineTo(R,BOTTOM);ctx.lineTo(L,BOTTOM);ctx.lineTo(L,H/2+GOAL);ctx.moveTo(L,H/2-GOAL);ctx.lineTo(L,T);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W/2,T);ctx.lineTo(W/2,BOTTOM);ctx.arc(W/2,H/2,120,0,Math.PI*2);ctx.stroke();
 // The goal-side edges of the penalty areas stay OPEN, not white walls.
 ctx.beginPath();
 ctx.moveTo(L,H/2-210);ctx.lineTo(L+180,H/2-210);ctx.lineTo(L+180,H/2+210);ctx.lineTo(L,H/2+210);
 ctx.moveTo(R,H/2-210);ctx.lineTo(R-180,H/2-210);ctx.lineTo(R-180,H/2+210);ctx.lineTo(R,H/2+210);
 ctx.moveTo(L,H/2-130);ctx.lineTo(L+65,H/2-130);ctx.lineTo(L+65,H/2+130);ctx.lineTo(L,H/2+130);
 ctx.moveTo(R,H/2-130);ctx.lineTo(R-65,H/2-130);ctx.lineTo(R-65,H/2+130);ctx.lineTo(R,H/2+130);
 ctx.stroke();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(W/2,H/2,4,0,Math.PI*2);ctx.fill();
}

const camera={x:W/2,y:H/2,ready:false},view={width:0,height:0,dpr:1,zoom:1};
function resizeCanvas(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
 const width=Math.max(1,Math.round(rect.width*dpr)),height=Math.max(1,Math.round(rect.height*dpr));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}
 view.width=rect.width;view.height=rect.height;view.dpr=dpr;
 // Fixed close-range scale, not the full pitch. The user sees nearby play.
 view.zoom=Math.max(rect.width/980,rect.height/600,.35);
}
function updateCamera(dt){
 const me=(world.players||[]).find(p=>p.id===myId);
 if(!me)return;
 if(!camera.ready){camera.x=me.x;camera.y=me.y;camera.ready=true;return}
 const k=1-Math.exp(-Math.max(0,Math.min(dt,.06))*13);
 camera.x+=(me.x-camera.x)*k;
 camera.y+=(me.y-camera.y)*k;
}
function ballDirectionOverlay(){
 const me=(world.players||[]).find(p=>p.id===myId),b=world.ball;
 if(!me||!b||!view.width||!view.height)return;
 const w=view.width,h=view.height,z=view.zoom;
 const sx=w/2+(b.x-camera.x)*z,sy=h/2+(b.y-camera.y)*z;
 const edge=34;
 if(sx>=edge&&sx<=w-edge&&sy>=edge&&sy<=h-edge)return;
 const dx=sx-w/2,dy=sy-h/2;
 if(Math.hypot(dx,dy)<.01)return;
 const fraction=Math.min((w/2-edge)/Math.max(.001,Math.abs(dx)),(h/2-edge)/Math.max(.001,Math.abs(dy)),1);
 const ix=w/2+dx*fraction,iy=h/2+dy*fraction;
 ctx.save();
 ctx.translate(ix,iy);
 ctx.fillStyle="rgba(5,29,41,.92)";ctx.strokeStyle="#fff7";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.font="19px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("⚽",0,1);
 ctx.rotate(Math.atan2(dy,dx));
 ctx.fillStyle="#ffe17e";ctx.beginPath();ctx.moveTo(33,0);ctx.lineTo(24,-7);ctx.lineTo(24,7);ctx.closePath();ctx.fill();
 ctx.restore();
 // Distance is in approximate game-world units, never real-world metres.
 const dist=Math.round(Math.hypot(b.x-me.x,b.y-me.y));
 ctx.save();ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.textAlign="center";
 ctx.fillText(String(dist),ix,Math.max(12,iy-27));ctx.restore();
}
window.addEventListener("resize",resizeCanvas);
function draw(){
 resizeCanvas();
 const {width:w,height:height,dpr,zoom}=view;
 if(!w||!height)return;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(dpr*zoom,0,0,dpr*zoom,dpr*(w/2-camera.x*zoom),dpr*(height/2-camera.y*zoom));
 drawField();
 const ps=world.players||[];for(const p of ps){
  const mine=p.id===myId;
  ctx.save();ctx.shadowColor=p.team===0?"#61dcff":"#ff796c";ctx.shadowBlur=mine?19:6;
  ctx.beginPath();ctx.arc(p.x,p.y,P,0,Math.PI*2);ctx.fillStyle=p.team===0?"#268deb":"#eb554d";ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle=mine?"#fff":"#ffffff90";ctx.stroke();ctx.restore();
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 12px system-ui";ctx.fillText(mine?"ТЫ":p.team===0?"СИНИЙ":"КРАСНЫЙ",p.x,p.y-30);
  ctx.strokeStyle="#ffffffb0";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+(p.vx||0)*12,p.y+(p.vy||0)*12);ctx.stroke();
 }
 const ball=world.ball||{x:W/2,y:H/2};
 ctx.save();ctx.shadowColor="#fff";ctx.shadowBlur=14;ctx.fillStyle="#fff";ctx.strokeStyle="#26364a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(ball.x,ball.y,B,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ballDirectionOverlay();
 kickButton.style.setProperty("--charge",charging?Math.min(100,(performance.now()-chargeStart)/CHARGE_MS*100):0);
 const s=world.score||[0,0];$("score").textContent=s[0]+" : "+s[1];const t=Math.max(0,Math.ceil(world.time||0));$("clock").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
let netSend=0;
function frame(now){let dt=Math.min(.04,(now-lastFrame)/1000);lastFrame=now;
 if(mode==="practice")simulate(dt);
 updateCamera(dt);
